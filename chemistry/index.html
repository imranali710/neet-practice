<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEET Chemistry Chapters</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <script defer src="../assets/js/layout.js"></script>
</head>
<body data-subject="chemistry" data-parent="All Subjects" data-back="../index.html"
      data-title="Chemistry Chapters" 
      data-subtitle="Physical, Inorganic, and Organic Chemistry">

  <!-- Search Input -->
  <input type="text" id="chapterSearch" class="quiz-option" 
         style="margin-bottom: 1.25rem; cursor: text;" 
         placeholder="Search by chapter name or type (e.g. Mole, Organic)...">

  <!-- Quick Access Horizontal Bar -->
  <div id="quickAccessSection" style="display: none;">
    <div class="section-label">Quick Access</div>
    <div class="quick-access-scroll" id="quickAccessContainer"></div>
  </div>

  <!-- Main Chapter List -->
  <div class="section-label">All Chapters</div>
  <div class="card-grid" id="chapterContainer">
    <p style="color: var(--text-muted); font-size: 0.9rem;">Loading chapters...</p>
  </div>

  <script>
    let chapterData = [];
    const container = document.getElementById('chapterContainer');
    const quickContainer = document.getElementById('quickAccessContainer');
    const quickSection = document.getElementById('quickAccessSection');
    const searchInput = document.getElementById('chapterSearch');

    // 1. Fetch content from JSON
    fetch('data/chapters.json')
      .then(res => res.json())
      .then(data => {
        chapterData = data;
        renderQuickAccess(data);
        renderChapters(data);
      })
      .catch(err => {
        container.innerHTML = '<p style="color: var(--wrong-text);">Failed to load data/chapters.json</p>';
      });

    // 2. Render horizontal quick-access pills
    function renderQuickAccess(list) {
      const pinned = list.filter(item => item.quickAccess);
      if (pinned.length === 0) return;

      quickSection.style.display = 'block';
      quickContainer.innerHTML = '';
      
      pinned.forEach(item => {
        const pill = document.createElement('a');
        pill.className = 'quick-pill';
        pill.href = item.link;
        pill.innerHTML = `<span class="quick-dot"></span>${item.title}`;
        quickContainer.appendChild(pill);
      });
    }

    // 3. Render full chapter card grid
    function renderChapters(list) {
      container.innerHTML = '';
      
      if (list.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">No matching chapters found.</p>';
        return;
      }

      list.forEach(item => {
        const card = document.createElement('a');
        card.className = 'card';
        card.href = item.link;
        card.innerHTML = `
          <span class="badge chemistry">${item.category} • Class ${item.class}</span>
          <h3>${item.title}</h3>
          <p>${item.desc}</p>
        `;
        container.appendChild(card);
      });
    }

    // 4. Instant Search Filter
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      const filtered = chapterData.filter(item => 
        item.title.toLowerCase().includes(query) ||
        item.category.toLowerCase().includes(query) ||
        item.desc.toLowerCase().includes(query)
      );
      renderChapters(filtered);
    });
  </script>
</body>
</html>
