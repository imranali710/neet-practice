<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physics Formula Flashcards</title>
  
  <!-- MathJax Configuration and Script -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      },
      startup: {
        ready: () => {
          MathJax.startup.defaultReady();
          window.mathJaxReady = true;
          if (window.onMathJaxReady) window.onMathJaxReady();
        }
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d2f;
      --card-hover: #1c263d;
      --border: #23314d;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --glow: rgba(59, 130, 246, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 1.5rem 1rem 3rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 820px;
    }

    header {
      margin-bottom: 1.75rem;
      text-align: center;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
      color: #ffffff;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Batch Controls & Bar */
    .controls-panel {
      background: #111726;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
    }

    .meta-status {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .meta-status span {
      color: var(--accent);
    }

    .actions-group {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    button {
      padding: 0.55rem 1.1rem;
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid transparent;
      outline: none;
    }

    .btn-secondary {
      background-color: #1e293b;
      border-color: var(--border);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: #27354d;
      border-color: #3b82f6;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      box-shadow: 0 0 12px var(--glow);
    }

    /* Cards Stack */
    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.2s ease, transform 0.15s ease;
    }

    .card:hover {
      border-color: #3b82f6;
      background: var(--card-hover);
    }

    .card-header {
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .label-box {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .badge {
      align-self: flex-start;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.35;
    }

    .icon-toggle {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #1e293b;
      color: var(--text-muted);
      font-size: 0.8rem;
      transition: transform 0.2s ease, background 0.2s;
    }

    .card.revealed .icon-toggle {
      transform: rotate(180deg);
      background: var(--accent);
      color: #fff;
    }

    .card-body {
      display: none;
      padding: 1.1rem 1.25rem;
      border-top: 1px dashed var(--border);
      background: #0f1624;
    }

    .card.revealed .card-body {
      display: block;
    }

    .formula-display {
      font-size: 1.15rem;
      overflow-x: auto;
      padding: 0.5rem 0;
      color: #e2e8f0;
    }

    .notes {
      margin-top: 0.6rem;
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.45;
    }

    /* Fallback and loading */
    .loading-status {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      font-size: 1rem;
    }

    .error-box {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Physics Formula Drill</h1>
      <div class="subtitle">Randomized 10-formula batches. Click any card or reveal all.</div>
    </header>

    <div id="error-container"></div>

    <div class="controls-panel">
      <div class="meta-status">
        Batch <span id="batch-current">1</span> of <span id="batch-total">1</span> 
        (<span id="showing-range">0-0</span> of <span id="total-count">0</span> items)
      </div>
      <div class="actions-group">
        <button id="toggle-all-btn" class="btn-secondary">Reveal All (10)</button>
        <button id="reshuffle-btn" class="btn-secondary" title="Reshuffle entire collection">Reshuffle</button>
        <button id="next-btn" class="btn-primary">Next Batch &rarr;</button>
      </div>
    </div>

    <div id="cards-container" class="cards-list">
      <div class="loading-status">Loading formulas from formulas.json...</div>
    </div>
  </div>

  <script>
    const BATCH_SIZE = 10;
    let allFormulas = [];
    let randomizedPool = [];
    let currentBatchIndex = 0;
    let areAllRevealed = false;

    // Fisher-Yates array shuffle
    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    async function loadFormulas() {
      try {
        const response = await fetch('./formulas.json');
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        allFormulas = await response.json();
        randomizedPool = shuffle(allFormulas);
        currentBatchIndex = 0;
        renderBatch();
      } catch (err) {
        document.getElementById('cards-container').innerHTML = '';
        document.getElementById('error-container').innerHTML = `
          <div class="error-box">
            <strong>Could not load formulas.json:</strong> ${err.message}<br><br>
            <em>Tip:</em> If viewing locally via <code>file://</code>, modern browsers restrict <code>fetch()</code> requests. 
            Open the folder with VS Code's <strong>Live Server</strong> extension, or deploy it directly to GitHub Pages.
          </div>
        `;
      }
    }

    function renderBatch() {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';
      areAllRevealed = false;
      document.getElementById('toggle-all-btn').textContent = `Reveal All (${Math.min(BATCH_SIZE, getCurrentBatchSlice().length)})`;

      const totalItems = randomizedPool.length;
      const totalBatches = Math.max(1, Math.ceil(totalItems / BATCH_SIZE));
      const start = currentBatchIndex * BATCH_SIZE;
      const end = Math.min(start + BATCH_SIZE, totalItems);
      const batchItems = randomizedPool.slice(start, end);

      // Update counters
      document.getElementById('batch-current').textContent = currentBatchIndex + 1;
      document.getElementById('batch-total').textContent = totalBatches;
      document.getElementById('showing-range').textContent = `${start + 1}-${end}`;
      document.getElementById('total-count').textContent = totalItems;

      // Render cards
      batchItems.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${index}`;

        card.innerHTML = `
          <div class="card-header">
            <div class="label-box">
              <span class="badge">${item.chapter}</span>
              <div class="card-title">${item.title}</div>
            </div>
            <div class="icon-toggle">&#9660;</div>
          </div>
          <div class="card-body">
            <div class="formula-display">${item.formula}</div>
            ${item.notes ? `<div class="notes">\${item.notes}</div>` : ''}
          </div>
        `;

        card.addEventListener('click', () => {
          card.classList.toggle('revealed');
        });

        container.appendChild(card);
      });

      // Typeset formulas with MathJax
      if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise([container]).catch(console.error);
      }
    }

    function getCurrentBatchSlice() {
      const start = currentBatchIndex * BATCH_SIZE;
      return randomizedPool.slice(start, start + BATCH_SIZE);
    }

    // Toggle reveal for all visible cards
    document.getElementById('toggle-all-btn').addEventListener('click', () => {
      const cards = document.querySelectorAll('.card');
      areAllRevealed = !areAllRevealed;
      cards.forEach(c => {
        if (areAllRevealed) {
          c.classList.add('revealed');
        } else {
          c.classList.remove('revealed');
        }
      });
      document.getElementById('toggle-all-btn').textContent = areAllRevealed 
        ? 'Hide All' 
        : `Reveal All (${cards.length})`;
    });

    // Move to next batch (cycles back to start if at end)
    document.getElementById('next-btn').addEventListener('click', () => {
      const totalBatches = Math.ceil(randomizedPool.length / BATCH_SIZE);
      currentBatchIndex = (currentBatchIndex + 1) % totalBatches;
      renderBatch();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Reshuffle all
    document.getElementById('reshuffle-btn').addEventListener('click', () => {
      randomizedPool = shuffle(allFormulas);
      currentBatchIndex = 0;
      renderBatch();
    });

    // Initial fetch
    window.addEventListener('DOMContentLoaded', loadFormulas);
  </script>
</body>
</html>
